# Alpina VPN — public vhost. Routes all traffic to the frontend container
# and proxies /api/* + /health* to the backend.
#
# Replace `_yourdomain.example_` everywhere below with your real domain,
# then run the certbot bootstrap from DEPLOYMENT.md to issue certs.
#
# IMPORTANT: this file is intentionally split between HTTP (port 80) and
# HTTPS (port 443). On a fresh VPS you'll start with ONLY the HTTP server
# enabled so certbot can complete the http-01 challenge; once certs are
# issued, uncomment the HTTPS block and reload nginx.

# ── HTTP — http-01 challenge + redirect to HTTPS ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _yourdomain.example_;

    # ACME challenge files written by certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Once HTTPS is live, redirect every other request.
    location / {
        return 301 https://$host$request_uri;
    }
}

