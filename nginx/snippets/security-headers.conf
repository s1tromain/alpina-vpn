# Defence-in-depth headers. The backend also sets a subset via helmet —
# nginx layering means a misconfigured backend can't silently drop them.

# HSTS — 6 months. Bump to 2 years + preload once you're certain.
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

# Stop pages being framed (clickjacking). Telegram opens this in its own
# WebView, so DENY is fine — there's no legitimate embedder.
add_header X-Frame-Options "DENY" always;

# Block content-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Minimise referrer leakage to upstream services.
add_header Referrer-Policy "no-referrer" always;

# Granular permission policy — disable APIs we don't use.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
